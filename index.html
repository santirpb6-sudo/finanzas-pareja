<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas en pareja</title>
<meta name="theme-color" content="#0E8C80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="En pareja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Finanzas en pareja · vista Compu = tablero en grilla; vista Celular = app de una columna con pestañas abajo */
:root{
  --bg:#ECF1F1; --card:#FFFFFF; --fg:#121A1B; --muted:#6B7A7B; --line:#E1E8E8;
  --accent:#0E8C80; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --santi:#0E8C80; --meli:#D9664D; --meli-soft:#FBE7E1;
  --pos:#1E9E5A; --neg:#D2483F; --frame:#1B2324; --overlay:rgba(10,20,20,.38);
  --c1:#1FA97A; --c2:#F2A516; --c3:#F0644F; --c4:#4F6BED; --c5:#9B59D6; --c6:#98A3A4; --c7:#E64C93; --c8:#22A6D6;
  --shadow:0 1px 2px rgba(15,40,38,.05),0 8px 24px rgba(15,40,38,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F10; --card:#161C1D; --fg:#EEF3F3; --muted:#8C9A9B; --line:#253031;
  --accent:#2CC2B2; --accent-ink:#06211E; --accent-soft:#0F302C;
  --santi:#2CC2B2; --meli:#F08A70; --meli-soft:#3A211B;
  --pos:#3BCB7C; --neg:#F07B76; --frame:#2A3536; --overlay:rgba(0,0,0,.55);
  --c1:#2DC08E; --c2:#F5B83A; --c3:#F57D6A; --c4:#7189F5; --c5:#B57BE6; --c6:#6E7B7C; --c7:#F06BA8; --c8:#45BCE6;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F10; --card:#161C1D; --fg:#EEF3F3; --muted:#8C9A9B; --line:#253031;
  --accent:#2CC2B2; --accent-ink:#06211E; --accent-soft:#0F302C;
  --santi:#2CC2B2; --meli:#F08A70; --meli-soft:#3A211B;
  --pos:#3BCB7C; --neg:#F07B76; --frame:#2A3536; --overlay:rgba(0,0,0,.55);
  --c1:#2DC08E; --c2:#F5B83A; --c3:#F57D6A; --c4:#7189F5; --c5:#B57BE6; --c6:#6E7B7C; --c7:#F06BA8; --c8:#45BCE6;
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,select{font-family:inherit;font-size:15px;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Barra de control del prototipo */
.ctrl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;font-weight:800}
.ex{font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.ctrl-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;min-height:36px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
select.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;min-height:38px;font-weight:600}

/* Tarjetas */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}

.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.av.s{background:var(--santi)}.av.m{background:var(--meli)}
.avs{display:inline-flex}.avs .av+.av{margin-left:-8px;box-shadow:0 0 0 2px var(--card)}

.bal-lbl{font-size:15px;color:var(--muted);margin:0}
.bal{font-size:52px;font-weight:700;letter-spacing:-.03em;margin:4px 0 0;line-height:1.05;overflow-wrap:anywhere}
.bal.zero{color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.trio div{background:var(--bg);border-radius:14px;padding:10px 12px}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-size:17px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.danger{background:var(--neg);color:#fff}
.btn.sm{min-height:36px;padding:7px 13px;font-size:14px}

.mes{background:var(--accent);color:var(--accent-ink)}
.mes .bal-lbl{color:inherit;opacity:.8}
.mes .bal{font-size:40px}
.mes-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mes-g div{background:color-mix(in srgb,var(--accent-ink) 14%,transparent);border-radius:14px;padding:10px 12px}
.mes-g span{display:block;font-size:12px;opacity:.8}.mes-g b{font-size:17px}

/* Carga rápida */
.quick{display:flex;flex-direction:column;gap:10px}
.qrow{display:flex;gap:8px;align-items:center}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 16px;min-height:46px}
.qrow input:focus{border-color:var(--accent);outline:none}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:700;flex:none}
.send:disabled{opacity:.35;cursor:default}
.prev{font-size:14px;color:var(--muted);min-height:20px;padding-left:6px}
.prev b{color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Dona */
.donut-w{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:14px}
.donut .mid small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.leg div{display:flex;align-items:center;gap:8px;font-size:14px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg button{border:0;background:none;padding:0;text-align:left;display:flex;gap:8px;align-items:center;flex:1;min-width:0;font-size:14px}

/* Quién pagó */
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.who{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.who b{display:block;font-size:18px}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:130px;margin-top:22px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;cursor:default}
.bar i{display:block;border-radius:5px 5px 0 0;min-height:2px}
.bar i+i{border-radius:0}
.bar.cur i{outline:0}
.bars-l{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.bars-l .cur{color:var(--fg);font-weight:700}
.tip{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}

/* Listas */
.row{display:flex;align-items:center;gap:12px;padding:9px 0;min-height:56px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.ico{width:38px;height:38px;border-radius:50%;background:var(--c,var(--c6));display:grid;place-items:center;font-size:18px;flex:none}
.ico.sm{width:28px;height:28px;font-size:14px}
.txt{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;vertical-align:1px}
.tag.s{background:var(--accent-soft);color:var(--santi)}.tag.m{background:var(--meli-soft);color:var(--meli)}

/* Tabla */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td.r,th.r{text-align:right}
.cat{display:flex;align-items:center;gap:8px}
.tfil{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ibtn{border:0;background:none;color:var(--muted);font-size:15px;padding:6px 8px;border-radius:8px;min-height:36px}
.ibtn:hover{background:var(--bg);color:var(--fg)}
.foot{display:flex;justify-content:space-between;padding:12px 10px 0;font-weight:700;border-top:1px solid var(--line)}

/* Celular */
.phone-w{display:flex;justify-content:center}
.phone{width:100%;max-width:400px;background:var(--bg);position:relative}
.phone.framed{border:11px solid var(--frame);border-radius:52px;height:820px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.scr{height:100%;overflow-y:auto;padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}
.phone:not(.framed) .scr{padding:0 0 96px;height:auto;overflow:visible}
.ph-h{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.ph-h h1{font-size:30px;margin:0;letter-spacing:-.02em}
.phone .card{border-radius:18px;padding:16px}
.phone .bal{font-size:42px}
.phone .trio b{font-size:15px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px 22px}
.phone:not(.framed) .tabs{position:fixed;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;justify-content:center}
.tabs button span{font-size:20px}
.tabs button.on{color:var(--accent)}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 4px -4px}
.catbar{display:flex;flex-direction:column;gap:9px}
.cb{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.cb .tr{height:6px;border-radius:999px;background:var(--line);margin-top:4px;overflow:hidden}
.cb .tr i{display:block;height:100%;border-radius:999px}

/* Hoja de edición */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto}
@media (min-width:700px){.sheet{border-radius:24px}}
.sheet h2{margin:0;font-size:20px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh-a{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.pend{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--meli-soft);border-radius:14px;padding:10px 12px;font-size:14px}
.conf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:max(14px,env(safe-area-inset-top,0px))!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login .logo{width:56px;height:56px;border-radius:16px;font-size:26px;margin:0 auto}
.login h2{margin:0;font-size:22px}
.link{border:0;background:none;color:var(--accent);font-weight:600;min-height:40px}
#modo:empty{display:none}
.err{color:var(--neg);font-size:14px;min-height:18px;margin:0}
@media (max-width:519px){.ctrl{display:none}.ctrl.on-phone{display:flex}}
.qf{display:flex;flex-direction:column;gap:10px}
.qmonto{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;min-height:52px;font-size:24px;font-weight:700}
.qcom{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px;min-height:46px}
.qmonto:focus,.qcom:focus{border-color:var(--accent);outline:none}
.qcats .chip{font-size:14px}
.tag.a{background:var(--line);color:var(--fg)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:2px 2px -4px}
.pseg{display:flex}.pseg button{flex:1}
.para{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:50px;font-weight:600;color:var(--muted);text-align:left;font-size:15px}
.pp b{margin-left:auto;font-weight:700;font-size:14px}
.pp .ck{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.pp.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.pp.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet .seg{display:flex;width:100%}.sheet .seg button{flex:1;padding:7px 4px;white-space:nowrap;font-size:14px}
.qtxt{min-height:52px;font-size:17px;border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <div class="brand"><div class="logo">$</div>Finanzas en pareja <span class="ex" id="modo"></span></div>
    <div class="ctrl-r">
      <span class="lbl">Vista</span>
      <div class="seg" id="segVista"><button data-act="vista" data-v="cel">📱 Celular</button><button data-act="vista" data-v="compu">💻 Compu</button></div>
      <span class="lbl" id="lblYo">Entrás como</span>
      <div class="seg" id="segYo"><button data-act="yo" data-v="santi">Santi</button><button data-act="yo" data-v="meli">Meli</button></div>
      <select class="pill" id="selMes" aria-label="Mes"></select>
      <button class="btn ghost sm" id="salir" hidden>Salir</button>
    </div>
  </div>
  <div id="main"></div>
</div>
<div id="layer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CATS=[
 {id:'super',n:'Súper',e:'🛒',c:'c1',k:['super','chino','verdu','verduleria','carni','carniceria','coto','dia','almacen']},
 {id:'casa',n:'Casa',e:'🏠',c:'c4',k:['alquiler','expensas','ferreteria','limpieza','casa','mueble']},
 {id:'serv',n:'Servicios',e:'💡',c:'c8',k:['luz','gas','agua','internet','wifi','epe','litoral']},
 {id:'perros',n:'Perros',e:'🐶',c:'c2',k:['perro','perros','vete','veterinaria','alimento','balanceado']},
 {id:'comida',n:'Comida afuera',e:'🍔',c:'c3',k:['pedidosya','rappi','pizza','sushi','birra','cena','almuerzo','helado','delivery','empanadas']},
 {id:'salidas',n:'Salidas',e:'🎉',c:'c5',k:['cine','bar','recital','teatro','boliche','entradas']},
 {id:'viajes',n:'Viajes',e:'\u2708\ufe0f',c:'c7',k:['viaje','hotel','micro','pasajes','airbnb','cabaña']},
 {id:'otros',n:'Otros',e:'📦',c:'c6',k:[]}
];
const NOM={santi:'Santi',meli:'Meli',ambos:'Los dos'}, INI={santi:'S',meli:'M'};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const _d=new Date(),HOY=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
let nid=100;
const S={
  yo:'santi', vista:(()=>{try{return localStorage.getItem('fp-vista')}catch(e){return null}})()||(innerWidth<760?'cel':'compu'), mes:HOY.slice(0,7), fCat:'', fPago:'', qPago:null, edit:null, conf:null, delConf:false, tab:'inicio',
  movs:[]
};


const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'$\u00a0'+Math.round(Math.abs(n)).toLocaleString('es-AR');
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const otro=p=>p==='santi'?'meli':'santi';
const mesNom=k=>{const [y,mm]=k.split('-');return MESES[+mm-1]+' '+y};
const mesCorto=k=>MESES[+k.split('-')[1]-1].slice(0,3);
const diaNom=f=>{const d=new Date(f+'T12:00');return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
const fCorta=f=>{const [,mm,dd]=f.split('-');return +dd+'/'+ +mm};
const movsMes=k=>S.movs.filter(x=>x.fecha.slice(0,7)===k).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));
const gastosMes=k=>movsMes(k).filter(x=>x.tipo==='gasto');

// Cuánto le debe Meli a Santi en el mes (negativo: Santi le debe a Meli)
function resumen(k){
  let santi=0,meli=0,total=0,b=0,parteS=0;
  for(const x of movsMes(k)){
    if(x.tipo==='gasto'){
      total+=x.monto; const ps=x.monto*x.parteS/100; parteS+=ps;
      if(x.pago==='ambos'){ santi+=x.monto/2; meli+=x.monto/2; b+=x.monto/2-ps; }
      else { if(x.pago==='santi') santi+=x.monto; else meli+=x.monto; b+= x.pago==='santi' ? x.monto-ps : -ps; }
    } else if(x.tipo==='saldo'&&x.estado!=='pend'){ b+= x.de==='meli' ? -x.monto : x.monto; }
  }
  return {santi,meli,total,b,parteS,parteM:total-parteS,n:gastosMes(k).length};
}
function balTxt(b){
  if(Math.abs(b)<1) return {t:'Están a mano',deudor:null};
  const deudor=b>0?'meli':'santi', acreedor=otro(deudor);
  if(S.yo===deudor) return {t:'Le debés a '+NOM[acreedor],deudor};
  return {t:NOM[deudor]+' te debe',deudor};
}

function parse2(q){
  const n=t=>t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let s=' '+n(q)+' ', r={};
  const quien=w=>w==='mi'||w==='yo'||w==='me'?S.yo:(w==='meli'||w==='melani'||w==='ella')?'meli':(w==='santi'||w==='santiago'||w==='el')?'santi':null;
  const quita=re=>{s=s.replace(re,' ')};
  const mm=s.match(/(\d[\d.]*)(,\d+)?\s*(k\b|mil\b)?/);
  if(mm){let v=parseFloat(mm[1].replace(/\./g,'')+(mm[2]?'.'+mm[2].slice(1):''));if(mm[3])v*=1000;if(v>0)r.monto=v;s=s.replace(mm[0],' ')}
  let m;
  if(m=s.match(/\b(?:para|solo|de)\s+(?:los\s+dos|ambos|nosotros)\b/)){r.para={santi:true,meli:true};quita(m[0])}
  else if(m=s.match(/\b(?:para|solo\s+(?:para\s+)?|solo\s+de)\s*(mi|meli|melani|ella|santi|santiago|el)\b/)){const p=quien(m[1]);if(p){r.para={santi:p==='santi',meli:p==='meli'};quita(m[0])}}
  if(m=s.match(/\b(?:pagamos(?:\s+(?:los\s+dos|a\s+medias|mitad\s+y\s+mitad))?|pagaron\s+los\s+dos|a\s+medias)\b/)){r.pago='ambos';quita(m[0])}
  else if(m=s.match(/\bpague\b|\blo\s+pague\b/)){r.pago=S.yo;quita(m[0])}
  else if(m=s.match(/\bpago\s+(yo|meli|melani|ella|santi|santiago|el)\b|\b(yo|meli|melani|santi|santiago)\s+pago\b/)){r.pago=quien(m[1]||m[2]);quita(m[0])}
  else if(m=s.match(/\b(meli|melani|santi|santiago)\b/)){r.pago=quien(m[1]);quita(m[0])}
  const ws=s.split(/\s+/).filter(Boolean);
  for(const w of ws){const c=CATS.find(x=>n(x.n).split(' ')[0]===w||x.id===w||x.k.includes(w)); if(c){r.cat=c.id;break}}
  let com=ws.filter(w=>!(r.cat&&(n(cat(r.cat).n).split(' ')[0]===w||w===r.cat))).join(' ').replace(/^(en|de|del|la|el|por|y)\s+/,'').trim();
  r.com=com?com.charAt(0).toUpperCase()+com.slice(1):'';
  return r;
}
function parse(q){
  const s=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const mm=s.match(/(\d[\d.]*)(,\d+)?\s*(k|mil)?/); if(!mm) return null;
  let monto=parseFloat(mm[1].replace(/\./g,'')+(mm[2]?'.'+mm[2].slice(1):'')); if(mm[3]) monto*=1000;
  if(!monto) return null;
  const words=s.replace(mm[0],' ').split(/\s+/).filter(Boolean);
  let c=null,pago=null,rest=[];
  for(const w of words){
    if(w==='meli'||w==='melani'){pago='meli';continue}
    if(w==='santi'||w==='yo'){pago='santi';continue}
    const f=CATS.find(x=>x.k.includes(w)); if(f&&!c) c=f;
    rest.push(w);
  }
  c=c||cat('otros');
  const orig=q.replace(/\d[\d.]*(,\d+)?\s*(k|mil)?/i,'').replace(/\b(meli|melani|santi|yo)\b/ig,'').trim();
  const det=orig?orig.charAt(0).toUpperCase()+orig.slice(1):c.n;
  return {monto,cat:c.id,det,pago};
}

function diasMes(k){const [y,mm]=k.split('-').map(Number);const tot=new Date(y,mm,0).getDate();return k===HOY.slice(0,7)?+HOY.slice(8):tot}

function donutCard(k){

  </div>`:`<p class="t2">Sin gastos</p>`}</div>`;
}
function last6(k){const [y,mm]=k.split('-').map(Number);const out=[];for(let i=5;i>=0;i--){const d=new Date(y,mm-1-i,1);out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}return out}
function quienCard(k){

function mesesOpts(){const meses=[...new Set(S.movs.map(x=>x.fecha.slice(0,7)).concat(HOY.slice(0,7)))].sort().reverse();return meses.map(k=>`<option value="${k}" ${k===S.mes?'selected':''}>${mesNom(k).replace(/^./,c=>c.toUpperCase())}</option>`).join('')}
function render(fromSnap){
  const af=document.activeElement&&document.activeElement.id, pv=$('#pmonto')?$('#pmonto').value:null;
  $('#modo').textContent={vivo:'Sos '+NOM[S.yo],cargando:'Cargando…',error:'Sin conexión',login:''}[MODO]||'';
  const fuera=MODO==='login'||MODO==='inicio';
  $('#salir').hidden=fuera;
  document.querySelector('.ctrl-r').style.visibility=fuera?'hidden':'';
  if(MODO==='inicio'){ $('#main').innerHTML='<div class="login"><div class="logo">$</div><p class="t2">Abriendo\u2026</p></div>'; return }
  if(MODO==='login'){ $('#main').innerHTML=vLogin(); bindLogin(); return }
  $('#segYo').hidden=$('#lblYo').hidden=MODO!=='demo';
  const sc=document.querySelector('.scr'), top=sc?sc.scrollTop:0;
  document.querySelectorAll('#segVista button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));
  document.querySelectorAll('#segYo button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.yo));
  $('#selMes').innerHTML=mesesOpts();
  document.querySelector('.ctrl').classList.toggle('on-phone',S.vista==='compu');
  $('#main').innerHTML=S.vista==='compu'?vCompu(S.mes):vCel(S.mes);
  const sc2=document.querySelector('.scr'); if(sc2) sc2.scrollTop=top;
  bindQuick();
  if((af==='qm'||af==='qc'||af==='qt')&&$('#'+af)){const el=$('#'+af);el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}
  if(pv!==null&&$('#pmonto'))$('#pmonto').value=pv;
  $('#pform')&&($('#pform').onsubmit=e=>{e.preventDefault();const mo=parseFloat(String($('#pmonto').value).replace(/\./g,'').replace(',','.'));if(!mo){toast('Falta el monto');return}
    const r=resumen(S.mes),de=r.b>0?'meli':'santi',fecha=S.mes===HOY.slice(0,7)?HOY:S.mes+'-28',yoDebo=S.yo===de;
    S.conf=null;guardar({id:'',tipo:'saldo',fecha,de,monto:mo,por:S.yo,estado:yoDebo?'pend':'ok'}).then(ok=>{if(ok)toast(yoDebo?'Aviso enviado a '+NOM[otro(de)]:'Anotado')});render();});
  document.querySelectorAll('.bar').forEach(b=>{b.onmouseenter=b.onclick=()=>{$('#tip').textContent=b.dataset.tip}});
  $('#selMes2')&&($('#selMes2').onchange=e=>{S.mes=e.target.value;S.conf=null;render()});
  $('#fCat')&&($('#fCat').onchange=e=>{S.fCat=e.target.value;render()});
  $('#fPago')&&($('#fPago').onchange=e=>{S.fPago=e.target.value;render()});
  if(!fromSnap) renderSheet();
}
function qMonto(){const n=parseFloat(String(S.qM||'').replace(/[$\s]/g,'').replace(/\./g,'').replace(',','.'));return n>0?n:0}
function bindQuick(){
  const t=$('#qt'); if(t){ t.oninput=()=>{S.qT=t.value; const r=parse2(t.value);
    S.qM=r.monto?String(r.monto).replace('.',','):''; S.qCat=r.cat||null; S.qC=r.com; if(r.pago) S.qPago=r.pago; S.qPara=r.para||null; render();};
    t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}}; }
  const m=$('#qm'); if(!m) return;
  const upd=()=>{const ps=qPS(),mo=qMonto();if(ps===null)return;
    if($('#qpS'))$('#qpS').textContent=ps>0?fmt(mo*ps/100):'\u2014'; if($('#qpM'))$('#qpM').textContent=ps<100?fmt(mo*(100-ps)/100):'\u2014'};
  m.oninput=()=>{S.qM=m.value;upd()}; $('#qc').oninput=()=>{S.qC=$('#qc').value};
  $('#qform').onsubmit=e=>{e.preventDefault();
    const monto=qMonto(); if(!monto){toast('Falta el monto');m.focus();return}
    const ps=qPS(); if(ps===null){toast('Eleg\u00ed para qui\u00e9n');return}
    if(!S.qCat){toast('Eleg\u00ed una categor\u00eda');return}
    const c=cat(S.qCat), fecha=S.mes===HOY.slice(0,7)?HOY:S.mes+'-01';
    const x={id:'',tipo:'gasto',fecha,det:(S.qC||'').trim()||c.n,cat:S.qCat,monto,pago:S.qPago||S.yo,por:S.yo,parteS:ps};
    S.qM='';S.qC='';S.qCat=null;S.qPara=null;S.qT='';S.qPago=null;S.qManual=false; if(document.activeElement)document.activeElement.blur(); render();
    guardar(x).then(ok=>{if(ok)toast('Guardado')});};
}

/* ---------- Hoja de edición ---------- */
function renderSheet(){
  const L=$('#layer');
  if(!S.edit){L.innerHTML='';return}
  const x=S.edit, isS=x.tipo==='saldo';
  L.innerHTML=`<div class="ov" data-act="close"><form class="sheet" id="sh">
    <h2>${x.id?(isS?'Pago entre ustedes':'Editar gasto'):'Nuevo gasto'}</h2>
    ${isS?`<div class="fld"><label>Quién le pasó plata a quién</label><div class="seg"><button type="button" class="${x.de==='meli'?'on':''}" data-act="sde" data-v="meli">Meli → Santi</button><button type="button" class="${x.de==='santi'?'on':''}" data-act="sde" data-v="santi">Santi → Meli</button></div></div>`:
    `<div class="fld"><label for="eDet">Comentario</label><input id="eDet" value="${esc(x.det)}"></div>
    <div class="two"><div class="fld"><label for="eCat">Categoría</label><select id="eCat">${CATS.map(c=>`<option value="${c.id}" ${x.cat===c.id?'selected':''}>${c.e} ${c.n}</option>`).join('')}</select></div>`}
    ${isS?'<div class="two">':''}<div class="fld"><label for="eMonto">Monto</label><input id="eMonto" inputmode="decimal" value="${x.monto||''}"></div>
    ${isS?`<div class="fld"><label for="eFecha">Fecha</label><input id="eFecha" type="date" value="${x.fecha}"></div></div>`:`</div>
    <div class="two"><div class="fld"><label for="eFecha">Fecha</label><input id="eFecha" type="date" value="${x.fecha}"></div>
    <div class="fld"><label>Pagó</label><div class="seg"><button type="button" class="${x.pago==='santi'?'on':''}" data-act="epago" data-v="santi">Santi</button><button type="button" class="${x.pago==='meli'?'on':''}" data-act="epago" data-v="meli">Meli</button><button type="button" class="${x.pago==='ambos'?'on':''}" data-act="epago" data-v="ambos">Los dos</button></div></div></div>
    <div class="fld"><label>¿Para quién?</label>${paraBtns(x.parteS>0,x.parteS<100,x.parteS,x.monto||0,'epara',['epS','epM'])}
    <div class="two" style="margin-top:6px"><div class="fld"><label for="ePS">% Santi</label><input id="ePS" inputmode="numeric" value="${x.parteS}"></div><div class="fld"><label>% Meli</label><input value="${100-x.parteS}" disabled></div></div></div>`}
    <div class="sh-a">${x.id?(S.delConf?`<span class="conf">¿Borrar?<button type="button" class="btn danger sm" data-act="delOk">Borrar</button><button type="button" class="btn ghost sm" data-act="delNo">No</button></span>`:`<button type="button" class="btn ghost" data-act="del">Borrar</button>`):'<span></span>'}
    <span style="display:flex;gap:8px"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn">Guardar</button></span></div>
    ${x.id?`<p class="t2" style="margin:0">Cargó ${NOM[x.por]}</p>`:''}
  </form></div>`;
  $('#sh').onsubmit=e=>{e.preventDefault();saveSheet()};
}
function readSheet(){
  const x=S.edit; if(!x) return;
  const v=id=>{const el=$('#'+id);return el?el.value:null};
  if(v('eDet')!==null) x.det=v('eDet');
  if(v('eCat')!==null) x.cat=v('eCat');
  if(v('eFecha')) x.fecha=v('eFecha');
  const mo=parseFloat(String(v('eMonto')||'').replace(/\./g,'').replace(',','.')); x.monto=isNaN(mo)?0:mo;
  if(v('ePS')!==null){const p=Math.min(100,Math.max(0,parseInt(v('ePS'))||0)); x.parteS=p}
}
function saveSheet(){
  readSheet(); const x=S.edit;
  if(!x.monto){toast('Falta el monto');return}
  if(x.tipo==='gasto'&&!x.det.trim()) x.det=cat(x.cat).n;
  S.mes=x.fecha.slice(0,7); S.edit=null; S.delConf=false; render();
  guardar(x).then(ok=>{if(ok)toast('Guardado')});
}

let tt;function toast(t){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;tt=setTimeout(()=>el.remove(),1600)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='close'&&e.target!==b&&b.tagName!=='BUTTON') return;
  switch(a){
    case 'vista': S.vista=v; try{localStorage.setItem('fp-vista',v)}catch(e){} render(); break;
    case 'yo': S.yo=v; S.qPago=null; S.conf=null; render(); toast('Ahora sos '+NOM[v]); break;
    case 'qpago': S.qPago=v; render(); break;
    case 'borrarTodo': S.conf='borrarTodo'; render(); break;
    case 'borrarTodoOk': S.conf=null; borrarTodo(); break;
    case 'qpara': {const q={...(S.qPara||{santi:true,meli:true})}; q[v]=!q[v]; S.qPara=q; render();} break;
    case 'epara': {readSheet(); const s0=S.edit.parteS>0,m0=S.edit.parteS<100; const s1=v==='santi'?!s0:s0, m1=v==='meli'?!m0:m0; if(!s1&&!m1){toast('Tiene que ser para alguien');break} S.edit.parteS=s1&&m1?50:s1?100:0; renderSheet();} break;
    case 'qmanual': S.qManual=true; render(); setTimeout(()=>$('#qm')&&$('#qm').focus(),50); break;
    case 'qcancel': S.qM='';S.qC='';S.qCat=null;S.qPara=null;S.qT='';S.qPago=null;S.qManual=false; render(); break;
    case 'qcat': S.qCat=S.qCat===v?null:v; render(); break;
    case 'saldo': S.conf='saldo'; render(); break;
    case 'saldoNo': S.conf=null; render(); break;
    case 'pOk': {const x=S.movs.find(y=>String(y.id)===b.dataset.id);if(x)guardar({...x,estado:'ok'}).then(ok=>{if(ok)toast('Confirmado')});} break;
    case 'pNo': borrar(b.dataset.id).then(()=>toast('Aviso rechazado')); break;
    case 'nuevo': S.edit={id:'',tipo:'gasto',fecha:S.mes===HOY.slice(0,7)?HOY:S.mes+'-01',det:'',cat:'super',monto:0,pago:S.yo,por:S.yo,parteS:50}; S.delConf=false; renderSheet(); setTimeout(()=>$('#eDet')&&$('#eDet').focus(),50); break;
    case 'edit': {e.stopPropagation(); const x=S.movs.find(y=>String(y.id)===b.dataset.id); if(x){S.edit={...x};S.delConf=false;renderSheet()}} break;
    case 'close': S.edit=null; renderSheet(); break;
    case 'epago': readSheet(); S.edit.pago=v; renderSheet(); break;
    case 'sde': readSheet(); S.edit.de=v; renderSheet(); break;
    case 'eparte': readSheet(); S.edit.parteS=+v; renderSheet(); break;
    case 'del': readSheet(); S.delConf=true; renderSheet(); break;
    case 'delNo': readSheet(); S.delConf=false; renderSheet(); break;
    case 'delOk': {const id=S.edit.id; S.edit=null; S.delConf=false; renderSheet(); borrar(id).then(()=>toast('Borrado'));} break;
    case 'fcat': S.fCat=S.fCat===v?'':v; render(); document.querySelector('.tw')&&document.querySelector('.tw').scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'tab': S.tab=v; render(); break;
    case 'salir': salir(); break;
  }
});
$('#selMes').onchange=e=>{S.mes=e.target.value;S.conf=null;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.edit){S.edit=null;renderSheet()}});
let lw=innerWidth;addEventListener('resize',()=>{if((lw>=520)!==(innerWidth>=520)&&S.vista==='cel')render();lw=innerWidth});
/* ---------- Datos compartidos ---------- */
let MODO='inicio', COL=null;
async function guardar(x){
  const {id,...body}=x; if(!body.creado) body.creado=Date.now();
  if(MODO!=='vivo'){ toast('Todavía no hay conexión con los datos'); return false }
  try{ if(id) await COL.doc(id).set(body); else await COL.add(body); return true }
  catch(e){ toast(e&&e.code==='permission-denied'?'Tu usuario no tiene permiso para cargar.':'No se pudo guardar. Revisá la conexión.'); return false }
}
async function borrar(id){
  if(MODO!=='vivo'){ toast('Todavía no hay conexión con los datos'); return }
  try{ await COL.doc(id).delete() }catch(e){ toast('No se pudo borrar') }
}

let unsub=null, lerr='';
function mailGuardado(){try{return localStorage.getItem('fp-mail')||''}catch(e){return ''}}
function vLogin(){
  return `<div class="login card"><div class="logo">$</div><h2>Finanzas en pareja</h2>
    <form id="lform"><div class="fld"><label for="lmail">Mail</label><input id="lmail" type="email" autocomplete="username" inputmode="email" value="${esc(mailGuardado())}" required></div>
    <div class="fld"><label for="lpass">Contraseña</label><input id="lpass" type="password" autocomplete="current-password" required></div>
    <button class="btn">Entrar</button></form>
    <p class="err" id="lerr">${esc(lerr)}</p>
    <button class="link" id="olvide">Me olvidé la contraseña</button></div>`;
}
function bindLogin(){
  $('#lform').onsubmit=async e=>{e.preventDefault();lerr='';$('#lerr').textContent='Entrando…';
    try{ await firebase.auth().signInWithEmailAndPassword($('#lmail').value.trim(),$('#lpass').value) }
    catch(err){ const c=err&&err.code||''; $('#lerr').textContent=/invalid|wrong|not-found|credential/.test(c)?'Mail o contraseña incorrectos.':c.includes('too-many')?'Demasiados intentos. Esperá un rato.':'No se pudo entrar. Revisá la conexión.' } };
  $('#olvide').onclick=async()=>{const m=$('#lmail').value.trim(); if(!m){$('#lerr').textContent='Escribí tu mail arriba y tocá de nuevo.';return}
    try{ await firebase.auth().sendPasswordResetEmail(m); $('#lerr').textContent='Te mandamos un mail para cambiar la contraseña.' }catch(err){ $('#lerr').textContent='No se pudo mandar el mail.' } };
}
async function borrarTodo(){
  if(MODO!=='vivo'){ toast('Todavía no hay conexión con los datos'); render(); return }
  const ids=S.movs.map(x=>x.id); render();
  try{ for(let i=0;i<ids.length;i+=400){ const b=COL.firestore.batch(); ids.slice(i,i+400).forEach(id=>b.delete(COL.doc(id))); await b.commit() } toast('Datos borrados') }
  catch(e){ toast('No se pudo borrar todo') }
}
function salir(){ if(unsub){unsub();unsub=null} firebase.auth().signOut() }
function boot(){
  firebase.initializeApp(firebaseConfig);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  const fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  COL=fs.collection('movs');
  $('#salir').onclick=salir;
  render();
  firebase.auth().onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){ MODO='login'; S.movs=[]; S.edit=null; render(); return }
    const mail=(u.email||'').toLowerCase();
    const who=Object.keys(MAILS).find(k=>MAILS[k].toLowerCase()===mail);
    if(!who){ lerr='Este mail no tiene acceso a la app.'; firebase.auth().signOut(); return }
    try{localStorage.setItem('fp-mail',u.email)}catch(e){}
    S.yo=who; MODO='cargando'; render();
    const t=setTimeout(()=>{if(MODO==='cargando'){MODO='error';render()}},10000);
    unsub=COL.onSnapshot(snap=>{clearTimeout(t);MODO='vivo';S.movs=snap.docs.map(d=>({...d.data(),id:d.id}));render(true)},
      ()=>{clearTimeout(t);MODO='error';render();toast('No se pudieron leer los datos')});
  });
}
boot();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
